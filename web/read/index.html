<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>词间 · 每日精读</title>
<meta name="description" content="今天的一篇短文。没有题目，也不用打卡，读慢一点就好。">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./gestures.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="progress" id="progressBar" aria-hidden="true" hidden><span id="progress"></span></div>

<!-- reader chrome: back + font size, floating glass like the shell's import button -->
<div class="chrome" id="chrome" hidden>
  <button class="glass-btn chrome-back" id="backBtn" aria-label="回到近几篇">
    <svg data-icon="caret-left" width="20" height="20"></svg>
  </button>
  <div class="glass-capsule size-capsule" role="group" aria-label="字号">
    <button id="smaller" aria-label="缩小字号"><svg data-icon="minus" width="16" height="16"></svg></button>
    <span class="size-glyph" aria-hidden="true"><svg data-icon="text-aa" width="20" height="20"></svg></span>
    <button id="larger" aria-label="放大字号"><svg data-icon="plus" width="16" height="16"></svg></button>
  </div>
</div>

<!-- home -->
<div class="view view-home" id="homeView">
  <button class="glass-btn refresh" id="refreshBtn" aria-label="刷新今天的一篇" title="刷新">
    <svg data-icon="arrow-clockwise" width="20" height="20"></svg>
  </button>
  <div class="wrap">
    <div class="date" id="homeDate"></div>
    <h1>我的精读</h1>
    <div class="stats" id="stats"></div>
    <div id="heroSlot"></div>
    <h2 id="recentHead" hidden>近几篇</h2>
    <div class="rlist" id="recentList"></div>
  </div>
</div>

<!-- reader -->
<div class="view view-reader" id="readerView" hidden>
  <div class="reader-wrap">
    <header class="article-header" id="articleHeader"></header>
    <article id="article" lang="en"></article>
    <noscript><p class="read-empty">需要启用 JavaScript 才能读取本地文章。</p></noscript>
    <div class="end" id="endMark" hidden>
      <p><svg data-icon="check" width="16" height="16"></svg>读完了</p>
      <button class="btn" id="endBack">回到近几篇</button>
    </div>
  </div>
</div>
</body>
</html>
