apply plugin: 'com.android.application'
// Kotlin compilation uses AGP 9 built-in Kotlin (no kotlin-android plugin).
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing key lives outside version control: android/hwfee-release.jks plus
// android/keystore.properties. Without them the release APK remains unsigned.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasKeystore = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    namespace "com.hwfee.english"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { compose true }
    // Opt in to exercising the actual R8-optimized APK with instrumentation.
    testBuildType = project.findProperty('hwfeeTestBuildType') ?: 'debug'
    defaultConfig {
        applicationId "com.hwfee.english"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.0.12"
        testInstrumentationRunner = project.findProperty('hwfeeTestRunner') ?: 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles 'test-proguard-rules.pro'
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.all {
            // The host JDK strips Origin by default; Android's native transport sends it.
            systemProperty 'sun.net.http.allowRestrictedHeaders', 'true'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Liquid glass tab bar — same library Coolapk ships (Apache-2.0).
    implementation 'io.github.kyant0:backdrop:2.0.1'
    implementation 'io.github.kyant0:shapes:1.2.1'
    implementation 'org.jetbrains.compose.foundation:foundation-android:1.12.0'
    implementation 'org.jetbrains.compose.ui:ui-android:1.12.0'
    implementation 'org.jetbrains.compose.runtime:runtime-android:1.12.0'
    implementation 'org.jetbrains.compose.animation:animation-core-android:1.12.0'
    // Previews live under src/debug, so tooling is absent from the release APK.
    debugImplementation 'org.jetbrains.compose.ui:ui-tooling-preview-android:1.12.0'
    debugImplementation 'org.jetbrains.compose.ui:ui-tooling-android:1.12.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.robolectric:robolectric:4.17"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
